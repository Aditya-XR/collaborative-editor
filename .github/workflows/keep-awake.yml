name: Keep API awake

# Render's free service sleeps after ~15 idle minutes and takes ~30-60 s to wake. Pinging it
# every 5 minutes keeps it warm from 08:00 to 23:59 IST; overnight it is left to sleep, which
# keeps it well inside the 750 free instance-hours a month (~16 h a day ≈ 500 h).
#
# Cron runs in UTC; IST is UTC+5:30, so the window is 02:30-18:29 UTC.
#
# A fallback only: GitHub delays and drops frequent scheduled runs (twice in six hours on
# 2026-10-02), so an external cron service does the real work. See docs/DEPLOY.md, step 6.
on:
  schedule:
    - cron: '30-55/5 2 * * *' # 08:00-08:25 IST
    - cron: '*/5 3-17 * * *' # 08:30-23:25 IST
    - cron: '0-25/5 18 * * *' # 23:30-23:55 IST
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/healthz
        # The first ping of the morning wakes the service, so allow a slow answer and retries.
        run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 3 --retry-delay 10 --retry-all-errors
          https://collabedit-api.onrender.com/api/healthz
