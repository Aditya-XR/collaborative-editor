# Load balancer in front of the API containers (docker compose --profile full: two instances).
# Round robin with no sticky sessions, on purpose: a ticket from one instance is redeemed on the
# other, and people editing one document land on different instances, which is what the Redis
# pub/sub between instances has to handle (ADR 0004).

worker_processes auto;

events {
  # Every open editor holds two connections here (browser side and API side); the default 512
  # caps a single worker at about 250 editors.
  worker_connections 8192;
}

http {
  # Docker's DNS returns one address per api replica. Re-resolved every few seconds, so scaling
  # the service up or down, or recreating it, needs no nginx restart.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream api {
    zone api 64k;
    server api:8000 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSockets: pass the upgrade through, and let an idle editor's socket live as long as
      # the API allows (its own idle timeout is 150 s; clients send a heartbeat every 15).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Which instance answered, for the curious and for the load test.
      add_header X-Upstream $upstream_addr always;
    }
  }
}
