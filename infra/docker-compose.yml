# Local development stack.
#   docker compose -f infra/docker-compose.yml up -d                  -> Postgres + Redis only
#   docker compose -f infra/docker-compose.yml --profile full up -d   -> also the API container
# Host ports are 5433 (Postgres) and 6380 (Redis), so this stack can run next to
# another local Postgres/Redis on the default ports.
name: collabedit

services:
  postgres:
    image: postgres:18-alpine # matches production (Neon runs Postgres 18)
    environment:
      POSTGRES_USER: collabedit
      POSTGRES_PASSWORD: collabedit
      POSTGRES_DB: collabedit
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so the volume mounts one
      # level up. A new volume name: the old Postgres 17 volume (pgdata) is left untouched.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabedit -d collabedit']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    profiles: ['full']
    build: ../apps/api
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://collabedit:collabedit@postgres:5432/collabedit
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata18:
