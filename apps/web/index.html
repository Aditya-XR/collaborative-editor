<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Write together in real time, offline too." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CollabEdit</title>
    <script>
      // Before anything paints: the saved colour scheme, or the system's (see src/lib/theme.ts).
      try {
        var theme = localStorage.getItem('collabedit-theme')
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
